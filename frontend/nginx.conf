# DESPACHA — Nginx da imagem `web` (contexto http, via conf.d).
#
# Caminho de uma requisição:
#   internet → Traefik (HTTPS, no servidor) → este Nginx :8080 → /api/ → API :8000
#
#   /        → arquivos estáticos do build do React
#   /api/    → API na rede interna do compose (nunca publicada)

# ------------------------------------------------------------------ IP real
# O Traefik se conecta pela rede do Docker (faixas privadas) e informa o IP do
# cliente no X-Forwarded-For. Sem "recursive", vale o último endereço da lista:
# o que o próprio Traefik acrescentou, e não algo que o cliente inventou.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive off;

# --------------------------------------------------------------- rate limit
# Por IP e global (vale para todos os workers da API). Complementa o limite
# em memória da aplicação, que é por processo (ver docs/SEGURANCA.md).
limit_req_zone $binary_remote_addr zone=despacha_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=despacha_api:10m rate=20r/s;
limit_req_status 429;

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    server_tokens off;

    # Fotos chegam já comprimidas (~200 KB); o limite cobre o pior caso
    # (MAX_UPLOAD_MB=8 no backend) com folga.
    client_max_body_size 10m;

    # ---------------------------------------------------- headers de segurança
    # "always": vale também para respostas de erro.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # Geolocalização e câmera só para a própria origem (entregador); o resto, ninguém.
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(), payment=(), usb=()" always;
    # CSP do frontend:
    # - script-src 'self': nada de script inline (o tema usa /theme-init.js, arquivo próprio)
    # - style-src 'self': o Leaflet aplica estilos via CSSOM, permitido pela CSP
    # - img-src blob:: fotos/assinaturas protegidas são exibidas via blob: (fase 7)
    # - img-src __MAP_TILE_ORIGIN__: tiles do mapa (trocado no build da imagem)
    # - connect-src viacep: preenchimento de endereço pelo CEP
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: __MAP_TILE_ORIGIN__; font-src 'self'; connect-src 'self' https://viacep.com.br; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ------------------------------------------------------------------ API
    location /api/ {
        limit_req zone=despacha_api burst=40 nodelay;

        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        # Host original: a verificação de Origin do backend compara com ele.
        proxy_set_header Host $host;
        # IP real (já resolvido acima) para rate limit e auditoria da API.
        proxy_set_header X-Forwarded-For $remote_addr;
        # O Traefik termina o HTTPS; para a aplicação, a requisição é https.
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Autenticação: limite mais rígido (força bruta / credential stuffing).
    location /api/v1/auth/ {
        limit_req zone=despacha_auth burst=5 nodelay;

        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Documentação interativa: desligada no backend em produção; aqui, nem chega lá.
    location ~ ^/api/(docs|openapi\.json) {
        return 404;
    }

    # ------------------------------------------------------------- frontend
    root /usr/share/nginx/html;
    index index.html;

    # Arquivos com hash no nome (gerados pelo Vite): cache longo e imutável.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # add_header dentro de location substitui os de cima: repete os essenciais.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # SPA: qualquer rota do React (/painel, /entregador/...) devolve o index.html.
    # index.html nunca é cacheado: um deploy novo vale na próxima navegação.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: __MAP_TILE_ORIGIN__; font-src 'self'; connect-src 'self' https://viacep.com.br; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
    }

    # Arquivos ocultos (.git, .env...) nunca são servidos.
    location ~ /\. {
        deny all;
    }
}
