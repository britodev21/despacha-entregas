# DESPACHA — integração contínua: roda a cada push e pull request.
#
# Segurança:
# - permissions: só leitura do código; o workflow não publica nada.
# - Nenhuma senha no repositório: o PostgreSQL do CI aceita conexões sem senha
#   (container descartável, só existe durante o job) e as senhas dos usuários
#   do banco são geradas na hora.
# - Endurecimento possível: fixar as actions por SHA do commit em vez da tag.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --frozen

      - name: Lint (ruff, inclui regras de segurança)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Criar usuários e banco de teste
        run: |
          app_pw="$(openssl rand -hex 24)"
          owner_pw="$(openssl rand -hex 24)"
          echo "::add-mask::$app_pw"
          echo "::add-mask::$owner_pw"
          psql -h localhost -U postgres -v owner_password="$owner_pw" -v app_password="$app_pw" \
            -v db_name=despacha_test -f scripts/setup_db.sql
          {
            echo "TEST_DATABASE_URL=postgresql+psycopg://despacha_app:${app_pw}@localhost:5432/despacha_test"
            echo "TEST_MIGRATIONS_DATABASE_URL=postgresql+psycopg://despacha_owner:${owner_pw}@localhost:5432/despacha_test"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

      - name: Testes
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint e formatação
        run: |
          npm run lint
          npm run format:check

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6

      - name: Vulnerabilidades conhecidas (Python)
        working-directory: backend
        run: |
          uv export --frozen --no-emit-project --format requirements-txt > "$RUNNER_TEMP/req.txt"
          uvx pip-audit --strict --disable-pip -r "$RUNNER_TEMP/req.txt"

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Vulnerabilidades conhecidas (npm)
        working-directory: frontend
        run: npm audit --audit-level=high

  # Sobe a stack de produção (docker-compose.yml) e testa de ponta a ponta,
  # passando pelo Nginx da tela como o Traefik faria.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configuração de teste (segredos gerados na hora)
        run: |
          {
            echo "DOMINIO=localhost"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "DESPACHA_OWNER_PASSWORD=$(openssl rand -hex 24)"
            echo "DESPACHA_APP_PASSWORD=$(openssl rand -hex 24)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
          } > .env

      - name: Build e subida
        run: docker compose -f docker-compose.yml -f deploy/docker/compose.ci.yml up -d --build

      - name: Teste de ponta a ponta
        run: |
          set -euo pipefail
          base=http://localhost:8080
          for _ in $(seq 1 60); do
            curl -fsS "$base/api/v1/health" 2>/dev/null | grep -q '"status":"ok"' && break
            sleep 2
          done
          curl -fsS "$base/api/v1/health" | grep -q '"status":"ok"'

          echo "headers de segurança"
          headers="$(curl -fsSI "$base/")"
          echo "$headers" | grep -qi '^content-security-policy:.*default-src'
          echo "$headers" | grep -qi '^x-frame-options: DENY'
          echo "$headers" | grep -qi '^strict-transport-security:'

          echo "SPA, docs bloqueados e rota protegida"
          curl -fsS "$base/painel" | grep -q 'id="root"'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/api/docs")" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/api/v1/deliveries")" = 401

          echo "login pela tela (empresa e admin criados pela CLI)"
          cid="$(docker compose exec -T api python -m app.cli create-company --name CI | sed -E 's/.*\(([0-9a-f-]+)\).*/\1/')"
          pw="$(openssl rand -hex 16)"
          printf '%s\n' "$pw" | docker compose exec -T api python -m app.cli create-user \
            --company-id "$cid" --name "Admin CI" --email admin@ci.example.com --role ADMIN --password-stdin
          code="$(curl -s -o "$RUNNER_TEMP/login.json" -w '%{http_code}' \
            -H 'Content-Type: application/json' -H "Origin: $base" \
            -d "{\"identifier\":\"admin@ci.example.com\",\"password\":\"$pw\"}" "$base/api/v1/auth/login")"
          test "$code" = 200
          grep -q access_token "$RUNNER_TEMP/login.json"

          echo "isolamento da API"
          # (com set -e, "! comando" nunca derruba o script: por isso os if)
          if docker compose exec -T api env | grep -q MIGRATIONS_DATABASE_URL; then
            echo "a API recebeu a credencial do dono do schema"; exit 1
          fi
          test "$(docker compose exec -T api id -u)" != 0
          if docker compose exec -T api touch /app/gravacao-proibida 2>/dev/null; then
            echo "o disco da API deveria ser somente leitura"; exit 1
          fi
          echo "OK"

      - name: Logs (em caso de falha)
        if: failure()
        run: docker compose logs --tail 200
