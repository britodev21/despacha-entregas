# DESPACHA — site do Nginx (instale em /etc/nginx/sites-available/despacha
# e crie o link em sites-enabled). Troque <SEU_DOMINIO> e <PROVEDOR_DE_TILES>.
#
# Arquitetura (ADR, seção 3): mesma origem.
#   /         → arquivos estáticos do build do React
#   /api/     → Uvicorn em 127.0.0.1:8000 (nunca exposto direto)
#
# Certificado: Let's Encrypt via certbot no modo webroot (renovação sem
# derrubar o site). Primeira emissão: ver deploy/README.md, "HTTPS".

server {
    listen 80;
    listen [::]:80;
    server_name <SEU_DOMINIO>;
    server_tokens off;

    # Validação do Let's Encrypt (certbot --webroot) precisa de HTTP puro.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    # Todo o resto vira HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name <SEU_DOMINIO>;

    ssl_certificate     /etc/letsencrypt/live/<SEU_DOMINIO>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<SEU_DOMINIO>/privkey.pem;

    # TLS moderno (perfil "intermediate" da Mozilla): só TLS 1.2/1.3 e cifras
    # com sigilo futuro (forward secrecy). Sem OCSP stapling: o Let's Encrypt
    # encerrou o OCSP.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:DespachaTLS:10m;
    ssl_session_tickets off;

    # Não anunciar a versão do Nginx.
    server_tokens off;

    # Fotos chegam já comprimidas (~200 KB); o limite cobre o pior caso
    # (MAX_UPLOAD_MB=8 no backend) com folga.
    client_max_body_size 10m;

    # ---------------------------------------------------- headers de segurança
    # "always": vale também para respostas de erro.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # Geolocalização e câmera só para a própria origem (entregador); o resto, ninguém.
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(), payment=(), usb=()" always;
    # CSP do frontend:
    # - script-src 'self': nada de script inline (o tema usa /theme-init.js, arquivo próprio)
    # - img-src blob:: fotos/assinaturas protegidas são exibidas via blob: (ADR, fase 7)
    # - img-src <PROVEDOR_DE_TILES>: tiles do mapa (Leaflet)
    # - connect-src viacep: preenchimento de endereço pelo CEP
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://<PROVEDOR_DE_TILES>; font-src 'self'; connect-src 'self' https://viacep.com.br; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ------------------------------------------------------------------ API
    location /api/ {
        limit_req zone=despacha_api burst=40 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        # Host original: a verificação de Origin do backend compara com ele.
        proxy_set_header Host $host;
        # O Uvicorn só confia nestes headers vindos de 127.0.0.1
        # (--forwarded-allow-ips): IP real para rate limit e auditoria.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Autenticação: limite mais rígido (força bruta / credential stuffing).
    location /api/v1/auth/ {
        limit_req zone=despacha_auth burst=5 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Documentação interativa: desligada no backend em produção; aqui, nem chega lá.
    location ~ ^/api/(docs|openapi\.json) {
        return 404;
    }

    # ------------------------------------------------------------- frontend
    root /var/www/despacha/current;
    index index.html;

    # Arquivos com hash no nome (gerados pelo Vite): cache longo e imutável.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # add_header dentro de location substitui os de cima: repete os essenciais.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # SPA: qualquer rota do React (/painel, /entregador/...) devolve o index.html.
    # index.html nunca é cacheado: um deploy novo vale na próxima navegação.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://<PROVEDOR_DE_TILES>; font-src 'self'; connect-src 'self' https://viacep.com.br; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
    }

    # Arquivos ocultos (.git, .env...) nunca são servidos.
    location ~ /\. {
        deny all;
    }
}
