# Zonas de rate limit (contexto http). Instale em /etc/nginx/conf.d/.
#
# Limite POR IP e GLOBAL (vale para todos os processos do Uvicorn): complementa
# o limite em memória da aplicação, que é por processo (ver docs/SEGURANCA.md).

# Login, refresh e afins: 10 requisições por minuto por IP, com rajada pequena.
limit_req_zone $binary_remote_addr zone=despacha_auth:10m rate=10r/m;

# API em geral: generoso para o uso normal (quadro atualiza a cada 15 s),
# mas corta automação abusiva.
limit_req_zone $binary_remote_addr zone=despacha_api:10m rate=20r/s;

limit_req_status 429;
